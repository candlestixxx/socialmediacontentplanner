version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "3031:3031"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - db
      - redis
    x-aws-logs:
      group: contentcommand-api-logs
      region: us-east-1

  db:
    image: postgres:15-alpine
    container_name: contentcommand-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: contentcommand
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: contentcommand-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

x-aws-cloudformation:
  Resources:
    ApiTaskDefinition:
      Properties:
        Memory: 2048
        Cpu: 1024

volumes:
  postgres_data:
  redis_data:
